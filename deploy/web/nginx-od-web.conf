# better-open-design — web build + daemon on two ports, one public origin.
#
# Shape B of deploy/web/README.md. Replace every `od.example.com`, the web root
# and the upstream port before using this file.
#
#   root         apps/web/out from `pnpm --filter @open-design/web build`
#   upstream     the daemon, bound to loopback (`OD_BIND_HOST=127.0.0.1`)
#   allow-list   the daemon must be started with OD_ALLOWED_ORIGINS=https://od.example.com
#
# TLS is assumed to terminate on this same server (certbot / any ACME client);
# add the certificate directives your setup uses.

upstream od_daemon {
    server 127.0.0.1:7456;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name od.example.com;

    # ssl_certificate     /etc/letsencrypt/live/od.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/od.example.com/privkey.pem;

    root /var/www/od.example.com;
    index index.html;

    # Artifacts, uploads and exports are large; the daemon's own limits are the
    # authority, nginx only needs to not be the smaller one.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed bundles. Everything under /_next/static is content-addressed.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell: deep links (/p/:id, /settings, …) must return index.html or
    # the client router never boots.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Daemon surface. Keep these prefixes byte-identical to the ones the client
    # treats as daemon-owned (apps/web/src/runtime/api-origin.ts).
    location ~ ^/(api|artifacts|frames|plugins)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # Runs, chat and workspace events stream over SSE; buffering them makes
        # the UI appear frozen until the run ends.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://od_daemon;
    }
}

# Optional: send plain HTTP to HTTPS. Remove if another server block owns :80.
server {
    listen 80;
    server_name od.example.com;
    return 301 https://$host$request_uri;
}
